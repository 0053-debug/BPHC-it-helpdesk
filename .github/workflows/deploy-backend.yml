name: Deploy API to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: bphc-it-helpdesk
      - name: Deploy API
        run: |
          gcloud run deploy iitsm-api \
            --source backend \
            --project bphc-it-helpdesk \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min 0 \
            --max 3 \
            --set-secrets SPRING_DATASOURCE_URL=SPRING_DATASOURCE_URL:latest,SPRING_DATASOURCE_USERNAME=SPRING_DATASOURCE_USERNAME:latest,SPRING_DATASOURCE_PASSWORD=SPRING_DATASOURCE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest \
            --set-env-vars '^|^SPRING_JPA_HIBERNATE_DDL_AUTO=validate|SPRING_SQL_INIT_MODE=always|CORS_ALLOWED_ORIGINS=https://bphc-it-helpdesk.web.app,https://bphc-it-helpdesk.firebaseapp.com,capacitor://localhost,https://localhost,http://localhost:*,http://127.0.0.1:*,iitsm://app'
