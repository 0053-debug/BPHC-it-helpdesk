server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: iitsm-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iitsm_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      keepalive-time: 0

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}

  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

sla:
  monitor:
    interval-ms: ${SLA_MONITOR_INTERVAL_MS:60000}

# Security & JWT
app:
  sla:
    monitor:
      interval-ms: ${SLA_MONITOR_INTERVAL_MS:60000}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
  demo-accounts:
    enabled: ${DEMO_ACCOUNTS_ENABLED:false}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
    enabled: ${FIREBASE_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://bphc-it-helpdesk.web.app,https://bphc-it-helpdesk.firebaseapp.com,capacitor://localhost,https://localhost,http://localhost:*,http://127.0.0.1:*,iitsm://app}
